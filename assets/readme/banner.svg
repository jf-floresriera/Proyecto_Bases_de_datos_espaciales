<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Tema 01 · DuckDB espacial y GeoParquet frente a PostgreSQL/PostGIS</title>
  <desc id="d">Un archivo GeoParquet con ocho grupos de filas; un filtro espacial recorre las estadísticas bbox y solo lee los grupos que intersecan la ventana.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16213a"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFD43B"/><stop offset="1" stop-color="#336791"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFD43B" stroke-opacity="0.05"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="10s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="340" fill="url(#acc)"/>
  <text x="56" y="72" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#FFD43B" letter-spacing="4">TEMA 01 · BASES DE DATOS ESPACIALES · UNAL 2026-2</text>
  <text x="56" y="132" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#f8fafc">DuckDB espacial</text>
  <text x="56" y="182" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#f8fafc">+ GeoParquet</text>
  <text x="56" y="218" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#cbd5e1">frente a PostgreSQL/PostGIS con índices GiST</text>
  <text x="56" y="252" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">Latencia · CPU · memoria RAM · E/S · planes de ejecución</text>
  <text x="56" y="300" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#64748b">WHERE bbox.xmin &lt;= x1 AND bbox.xmax &gt;= x0 ...</text>
  <rect x="56" y="308" width="0" height="2" fill="#FFD43B"><animate attributeName="width" values="0;380;380;0" keyTimes="0;0.4;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
  <text x="640" y="104" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#94a3b8">edificios.parquet · grupos de filas (orden Hilbert)</text>
  
